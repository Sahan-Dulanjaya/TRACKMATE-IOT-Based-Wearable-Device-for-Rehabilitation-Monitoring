<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Dashboard</title>
  <!-- Include Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Include Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-ksm0c1wGKkx3NVd3XPNqaodJ5zy+bZTpq6+XfYPrg3Icf/dQo0RRUP8oCjH/NwzQ" crossorigin="anonymous">
  <!-- Include Chart.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Custom CSS -->
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #333;
    }
    #notification {
      background-color: #ff4d4d;
      color: white;
      padding: 15px;
      border-radius: 5px;
      display: none;
      text-align: center;
      font-weight: bold;
      animation: fadeIn 1s;
      margin-bottom: 20px;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
    .data-grid, .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background-color: #fafafa;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
    }
    .card::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 5px;
      top: 0;
      left: 0;
      background-color: #007bff;
    }
    .card i {
      font-size: 40px;
      color: #007bff;
      margin-bottom: 15px;
    }
    .card h3 {
      margin: 0;
      font-size: 24px;
      color: #333;
    }
    .card p {
      margin: 5px 0 0;
      font-size: 16px;
      color: #777;
    }
    .chart-container {
      padding: 20px;
      position: relative;
      height: 400px; /* Adjust based on your preference */
    }
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    @media (max-width: 768px) {
      .data-grid, .chart-grid {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-user-heart"></i> Patient Dashboard</h1>
    <div id="notification">⚠️ <strong>Alert:</strong> Patient has fallen down!</div>

    <div class="data-grid">
      <div class="card">
        <i class="fas fa-walking"></i>
        <h3><span id="stepCount">0</span></h3>
        <p>Step Count</p>
      </div>
      <div class="card">
        <i class="fas fa-route"></i>
        <h3><span id="distance">0</span> m</h3>
        <p>Distance Travelled</p>
      </div>
      <div class="card">
        <i class="fas fa-fire-alt"></i>
        <h3><span id="caloriesBurned">0</span> kcal</h3>
        <p>Calories Burned</p>
      </div>
      <div class="card">
        <i class="fas fa-ruler-horizontal"></i>
        <h3><span id="accelX">0</span> m/s²</h3>
        <p>Acceleration X</p>
      </div>
      <div class="card">
        <i class="fas fa-ruler-vertical"></i>
        <h3><span id="accelY">0</span> m/s²</h3>
        <p>Acceleration Y</p>
      </div>
      <div class="card">
        <i class="fas fa-arrows-alt"></i>
        <h3><span id="accelZ">0</span> m/s²</h3>
        <p>Acceleration Z</p>
      </div>
      <div class="card">
        <i class="fas fa-sync-alt"></i>
        <h3><span id="gyroX">0</span> °/s</h3>
        <p>Gyro X</p>
      </div>
      <div class="card">
        <i class="fas fa-sync"></i>
        <h3><span id="gyroY">0</span> °/s</h3>
        <p>Gyro Y</p>
      </div>
      <div class="card">
        <i class="fas fa-redo-alt"></i>
        <h3><span id="gyroZ">0</span> °/s</h3>
        <p>Gyro Z</p>
      </div>
    </div>

    <h2 style="text-align:center; margin-top:50px;">Sensor Data Graphs</h2>
    <div class="chart-grid">
      <!-- Gyroscope chart card -->
      <div class="card chart-container">
        <h3>Gyroscope Data</h3>
        <div class="chart-wrapper">
          <canvas id="gyroChart"></canvas>
        </div>
      </div>
      <!-- Accelerometer chart card -->
      <div class="card chart-container">
        <h3>Accelerometer Data</h3>
        <div class="chart-wrapper">
          <canvas id="accelChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Create an EventSource to connect to the SSE endpoint
    const eventSource = new EventSource('/events');

    // Chart initialization
    const gyroCtx = document.getElementById('gyroChart').getContext('2d');
    const accelCtx = document.getElementById('accelChart').getContext('2d');

    const gyroChart = new Chart(gyroCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Gyro X', data: [], borderColor: 'red', fill: false },
          { label: 'Gyro Y', data: [], borderColor: 'green', fill: false },
          { label: 'Gyro Z', data: [], borderColor: 'blue', fill: false }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    const accelChart = new Chart(accelCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Accel X', data: [], borderColor: 'red', fill: false },
          { label: 'Accel Y', data: [], borderColor: 'green', fill: false },
          { label: 'Accel Z', data: [], borderColor: 'blue', fill: false }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    function getLocalTime() {
      const now = new Date();
      return now.toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: true });
    }

    // Function to update chart data
    function updateChartData(chart, dataX, dataY, dataZ) {
      const label = getLocalTime(); // Get formatted time for label
      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(dataX);
      chart.data.datasets[1].data.push(dataY);
      chart.data.datasets[2].data.push(dataZ);
      chart.update();
    }

    eventSource.onmessage = function(event) {
      const data = JSON.parse(event.data);
      console.log('Received data:', data);

      // Update the dashboard
      document.getElementById('stepCount').textContent = data.stepCount;
      document.getElementById('distance').textContent = parseFloat(data.distance).toFixed(2);
      document.getElementById('caloriesBurned').textContent = parseFloat(data.caloriesBurned).toFixed(2);
      document.getElementById('accelX').textContent = parseFloat(data.accelX).toFixed(2);
      document.getElementById('accelY').textContent = parseFloat(data.accelY).toFixed(2);
      document.getElementById('accelZ').textContent = parseFloat(data.accelZ).toFixed(2);
      document.getElementById('gyroX').textContent = parseFloat(data.gyroX).toFixed(2);
      document.getElementById('gyroY').textContent = parseFloat(data.gyroY).toFixed(2);
      document.getElementById('gyroZ').textContent = parseFloat(data.gyroZ).toFixed(2);

      // Update charts
      updateChartData(gyroChart, data.gyroX, data.gyroY, data.gyroZ);
      updateChartData(accelChart, data.accelX, data.accelY, data.accelZ);

      // Show notification if fallDetected is true
      if (data.fallDetected) {
        document.getElementById('notification').style.display = 'block';
      } else {
        document.getElementById('notification').style.display = 'none';
      }
    };

    eventSource.onerror = function(err) {
      console.error('EventSource failed:', err);
    };
</script>

  
</body>
</html>
